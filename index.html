<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>מכונות מיחזור</title>
    <style>
        body { font-family: sans-serif; background: #f4f7f6; padding: 20px; }
        .container { max-width: 800px; margin: auto; background: white; padding: 20px; border-radius: 8px; }
        table { width: 100%; border-collapse: collapse; }
        th, td { padding: 10px; border-bottom: 1px solid #ddd; text-align: right; }
    </style>
</head>
<body>
<div class="container">
    <h1>רשימת מכונות מיחזור</h1>
    <table id="machinesTable">
        <thead><tr><th>סוג</th><th>כתובת</th><th>ניווט</th></tr></thead>
        <tbody id="tableBody"></tbody>
    </table>
</div>

<script>
    // הנתונים מוטמעים כאן ישירות בקוד - זה ימנע את השגיאה של "קובץ לא נמצא"
    const machines = [
        { "address": "כפר מימון - מרכז מסחרי", "lat": 31.4314, "lng": 34.5371, "type": "KASHCASE" },
        { "address": "נתיבות - מתחם גלובוס סנטר", "lat": 31.4182, "lng": 34.5964, "type": "פיתקית" }
        // ... כאן תוכל להוסיף עוד שורות כאלו עם הנתונים שלך
    ];

    const tbody = document.getElementById('tableBody');
    machines.forEach(m => {
        tbody.innerHTML += `<tr>
            <td>${m.type}</td>
            <td>${m.address}</td>
            <td><a href="https://waze.com/ul?ll=${m.lat},${m.lng}&navigate=yes" target="_blank">Waze</a></td>
        </tr>`;
    });
</script>
</body>
</html>
