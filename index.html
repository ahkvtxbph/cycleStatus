<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>מכונות מיחזור CYCLE – שדות נגב</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;700&display=swap');
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Heebo',Arial,sans-serif;background:#F8FAF9;color:#111827;min-height:100vh}
header{background:#111827;padding:16px 24px;display:flex;align-items:center;gap:12px;flex-wrap:wrap;justify-content:space-between}
.logo{display:flex;align-items:center;gap:10px}
.logo-icon{width:38px;height:38px;background:#00B67A;border-radius:9px;display:flex;align-items:center;justify-content:center;font-size:18px}
.logo h1{color:#fff;font-size:18px;font-weight:700}
.logo span{color:#00B67A}
#lastUpdate{font-size:12px;color:#9CA3AF}
#statusBar{padding:9px 24px;font-size:13px;font-weight:500;display:flex;align-items:center;gap:8px}
.status-live{background:#D1FAE5;color:#065F46}
.status-backup{background:#FEF3C7;color:#92400E}
.status-loading{background:#F3F4F6;color:#6B7280}
#statusBar .dot{width:8px;height:8px;border-radius:50%;background:currentColor;flex-shrink:0}
.controls{padding:14px 24px;display:flex;flex-wrap:wrap;gap:10px;align-items:center;background:#fff;border-bottom:1px solid #E5E7EB}
.search-wrap{position:relative;flex:1;min-width:180px;max-width:320px}
.search-wrap .ico{position:absolute;right:10px;top:50%;transform:translateY(-50%);pointer-events:none;font-size:14px}
input[type=text]{width:100%;padding:9px 34px 9px 10px;border:1.5px solid #E5E7EB;border-radius:8px;font-family:inherit;font-size:14px;outline:none;background:#F3F4F6}
input[type=text]:focus{border-color:#00B67A;background:#fff}
select{padding:9px 10px;border:1.5px solid #E5E7EB;border-radius:8px;font-family:inherit;font-size:14px;background:#F3F4F6;cursor:pointer;outline:none}
.btn{padding:9px 16px;border-radius:8px;font-family:inherit;font-size:14px;font-weight:600;cursor:pointer;border:none;background:#00B67A;color:#fff;display:inline-flex;align-items:center;gap:6px}
.btn:hover{background:#008f5e}
.btn:disabled{background:#D1D5DB;color:#6B7280;cursor:not-allowed}
.counter{margin-right:auto;font-size:13px;color:#6B7280;font-weight:500}
.counter strong{color:#111827;font-size:20px;font-weight:700}
.stats{display:flex;gap:10px;padding:14px 24px;flex-wrap:wrap}
.sc{background:#fff;border-radius:10px;padding:12px 18px;flex:1;min-width:110px;box-shadow:0 1px 4px rgba(0,0,0,.07)}
.sc .sl{font-size:11px;color:#6B7280;font-weight:500}
.sc .sv{font-size:24px;font-weight:700;line-height:1.1}
.sv.blue{color:#0061FF}.sv.green{color:#00B67A}.sv.amber{color:#F59E0B}.sv.red{color:#EF4444}
.tw{padding:0 24px 24px;overflow-x:auto}
table{width:100%;border-collapse:collapse;background:#fff;border-radius:10px;overflow:hidden;box-shadow:0 1px 4px rgba(0,0,0,.07);font-size:14px}
th{background:#111827;color:#fff;padding:12px 14px;text-align:right;font-weight:600;font-size:13px;white-space:nowrap}
td{padding:12px 14px;border-bottom:1px solid #F3F4F6;vertical-align:middle}
tr:last-child td{border-bottom:none}
tr:hover td{background:#F0FDF8}
.bk{display:inline-flex;align-items:center;gap:4px;padding:3px 9px;border-radius:20px;font-size:12px;font-weight:600}
.bk.kash{background:#DBEAFE;color:#1D4ED8}
.bk.pit{background:#DCFCE7;color:#166534}
.sb{display:inline-flex;align-items:center;gap:4px;padding:3px 9px;border-radius:20px;font-size:12px;font-weight:600}
.sb.empty{background:#DCFCE7;color:#166534}
.sb.full{background:#FEF3C7;color:#92400E}
.sb.broken{background:#FEE2E2;color:#991B1B}
.sb.unknown{background:#F3F4F6;color:#6B7280}
.wb{display:inline-flex;align-items:center;gap:5px;padding:6px 12px;background:#33CCFF;color:#1a2a3a;border-radius:7px;text-decoration:none;font-weight:700;font-size:13px;white-space:nowrap}
.wb:hover{background:#00bfff}
.nm{font-weight:700}.ad{font-size:12px;color:#6B7280;margin-top:2px}
.empty-state{text-align:center;padding:50px;color:#6B7280}
@keyframes spin{to{transform:rotate(360deg)}}
.spin{display:inline-block;animation:spin .8s linear infinite}
</style>
</head>
<body>

<header>
  <div class="logo">
    <div class="logo-icon">♻️</div>
    <h1>מכונות <span>CYCLE</span> – שדות נגב</h1>
  </div>
  <span id="lastUpdate"></span>
</header>

<div id="statusBar" class="status-loading">
  <span class="dot"></span>
  <span id="statusText">טוען...</span>
</div>

<div class="controls">
  <div class="search-wrap">
    <span class="ico">🔍</span>
    <input type="text" id="searchInput" placeholder="חפש יישוב..." oninput="filterTable()">
  </div>
  <select id="statusFilter" onchange="filterTable()">
    <option value="all">כל הסטטוסים</option>
    <option value="ריקה">✅ ריקה</option>
    <option value="מלאה">⚠️ מלאה</option>
    <option value="לא תקינה">❌ לא תקינה</option>
  </select>
  <button class="btn" id="refreshBtn" onclick="tryLive()">
    <span id="ri">🔄</span> רענן
  </button>
  <div class="counter"><strong id="cnt">8</strong> מכונות</div>
</div>

<div class="stats" id="stats"></div>

<div class="tw">
  <table>
    <thead>
      <tr><th>#</th><th>יישוב</th><th>כתובת</th><th>סוג</th><th>סטטוס</th><th>ניווט</th></tr>
    </thead>
    <tbody id="tbody"></tbody>
  </table>
  <div class="empty-state" id="empty" style="display:none">לא נמצאו תוצאות</div>
</div>

<script>
var MACHINES = [
  {name:"סעד",       address:"סעד, מועצה אזורית שדות נגב",        lat:31.470185, lng:34.534356, type:"KASHCASE", status:"ריקה"},
  {name:"כפר מימון", address:"כפר מימון, מועצה אזורית שדות נגב",  lat:31.431401, lng:34.537180, type:"KASHCASE", status:"ריקה"},
  {name:"זמרת",      address:"זמרת, מועצה אזורית שדות נגב",        lat:31.447853, lng:34.552288, type:"KASHCASE", status:"ריקה"},
  {name:"עלומים",    address:"עלומים, מועצה אזורית שדות נגב",      lat:31.453049, lng:34.514711, type:"KASHCASE", status:"ריקה"},
  {name:"בית הגדי",  address:"בית הגדי, מועצה אזורית שדות נגב",   lat:31.422839, lng:34.607878, type:"KASHCASE", status:"ריקה"},
  {name:"תקומה",     address:"תקומה, מועצה אזורית שדות נגב",       lat:31.448536, lng:34.578085, type:"KASHCASE", status:"ריקה"},
  {name:"יושיביה",   address:"יושיביה, מועצה אזורית שדות נגב",     lat:31.444699, lng:34.608784, type:"KASHCASE", status:"ריקה"},
  {name:"מעגלים",    address:"מעגלים, מועצה אזורית שדות נגב",      lat:31.398859, lng:34.598239, type:"KASHCASE", status:"ריקה"}
];

var display = MACHINES.slice();

function setStatus(cls, msg) {
  var b = document.getElementById('statusBar');
  b.className = cls;
  document.getElementById('statusText').textContent = msg;
}

function now() {
  return new Date().toLocaleTimeString('he-IL',{hour:'2-digit',minute:'2-digit'});
}

function render() {
  filterTable();
  renderStats();
}

function renderStats() {
  var total = MACHINES.length;
  var empty = MACHINES.filter(function(m){return m.status==='ריקה'}).length;
  var full  = MACHINES.filter(function(m){return m.status==='מלאה'}).length;
  var brok  = MACHINES.filter(function(m){return m.status==='לא תקינה'}).length;
  document.getElementById('stats').innerHTML =
    '<div class="sc"><div class="sl">סה"כ</div><div class="sv blue">'+total+'</div></div>'+
    '<div class="sc"><div class="sl">✅ ריקות</div><div class="sv green">'+empty+'</div></div>'+
    '<div class="sc"><div class="sl">⚠️ מלאות</div><div class="sv amber">'+full+'</div></div>'+
    '<div class="sc"><div class="sl">❌ לא תקינות</div><div class="sv red">'+brok+'</div></div>';
}

function filterTable() {
  var q = document.getElementById('searchInput').value.toLowerCase().trim();
  var sf = document.getElementById('statusFilter').value;
  display = MACHINES.filter(function(m) {
    var match = (m.name+' '+m.address).toLowerCase().indexOf(q) > -1;
    var stat  = sf === 'all' || m.status === sf;
    return match && stat;
  });
  var tbody = document.getElementById('tbody');
  var empty = document.getElementById('empty');
  document.getElementById('cnt').textContent = display.length;
  if (!display.length) {
    tbody.innerHTML = '';
    empty.style.display = 'block';
    return;
  }
  empty.style.display = 'none';
  tbody.innerHTML = display.map(function(m, i) {
    var type = m.type === 'KASHCASE'
      ? '<span class="bk kash">🔵 KASHCASE</span>'
      : '<span class="bk pit">🟢 פיתקית</span>';
    var icons = {ריקה:'✅', מלאה:'⚠️', 'לא תקינה':'❌'};
    var cls   = {ריקה:'empty', מלאה:'full', 'לא תקינה':'broken'};
    var icon  = icons[m.status] || '❓';
    var scls  = cls[m.status] || 'unknown';
    var waze  = 'https://waze.com/ul?ll='+m.lat+','+m.lng+'&navigate=yes';
    return '<tr>'+
      '<td style="color:#6B7280;font-size:12px;font-weight:600">'+(i+1)+'</td>'+
      '<td><div class="nm">'+m.name+'</div></td>'+
      '<td style="font-size:13px">'+m.address+'</td>'+
      '<td>'+type+'</td>'+
      '<td><span class="sb '+scls+'">'+icon+' '+m.status+'</span></td>'+
      '<td><a href="'+waze+'" target="_blank" class="wb">🚗 Waze</a></td>'+
    '</tr>';
  }).join('');
}

function tryLive() {
  var btn = document.getElementById('refreshBtn');
  var ri  = document.getElementById('ri');
  btn.disabled = true;
  ri.className = 'spin';
  ri.textContent = '⏳';
  setStatus('status-loading', '⏳ מנסה להתחבר לשרת Cycle...');

  var s3 = 'https://cycle-app-bucket.s3.amazonaws.com/cycledata.js?nc='+Date.now();
  var proxy = 'https://api.allorigins.win/get?url='+encodeURIComponent(s3);

  fetch(proxy)
    .then(function(r){ return r.json(); })
    .then(function(j){
      if (j && j.contents) {
        var s = j.contents.indexOf('[');
        var e = j.contents.lastIndexOf(']');
        if (s > -1 && e > -1) {
          var arr = JSON.parse(j.contents.substring(s, e+1));
          var keywords = ['סעד','כפר מימון','זמרת','עלומים','בית הגדי','תקומה','יושיביה','מעגלים'];
          var found = arr.filter(function(m) {
            var a = (m.address||'');
            return keywords.some(function(k){ return a.indexOf(k) > -1; });
          });
          if (found.length) {
            MACHINES = found.map(function(m) {
              var name = keywords.find(function(k){ return (m.address||'').indexOf(k)>-1; }) || m.address.split(',')[0];
              var s = (m.status||m.Status||'').toLowerCase();
              var status = s.indexOf('empty')>-1||s.indexOf('ריק')>-1 ? 'ריקה'
                         : s.indexOf('full')>-1||s.indexOf('מלא')>-1  ? 'מלאה'
                         : s.indexOf('broken')>-1||s.indexOf('error')>-1 ? 'לא תקינה' : 'ריקה';
              return {name:name, address:m.address||'', lat:parseFloat(m.lat||0), lng:parseFloat(m.lng||0), type:'KASHCASE', status:status};
            });
            setStatus('status-live', '🟢 נתונים חיים משרת Cycle – '+now());
            document.getElementById('lastUpdate').textContent = 'עדכון: '+now();
            render();
            reset();
            return;
          }
        }
      }
      useBackup();
    })
    .catch(function(){ useBackup(); });

  function useBackup() {
    setStatus('status-backup', '🟡 גיבוי מקומי – לא הצלחנו להתחבר לשרת ('+now()+')');
    document.getElementById('lastUpdate').textContent = 'גיבוי | '+now();
    render();
    reset();
  }
  function reset() {
    btn.disabled = false;
    ri.className = '';
    ri.textContent = '🔄';
  }
}

// הפעל מיד – ללא המתנה ל-DOMContentLoaded
setStatus('status-backup', '🟡 נתוני גיבוי – 8 יישובי שדות נגב');
document.getElementById('lastUpdate').textContent = 'גיבוי מקומי';
render();
tryLive();
</script>
</body>
</html>
