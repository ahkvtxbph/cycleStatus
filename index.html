<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>מכונות מיחזור CYCLE – פריסה ארצית מלאה</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Heebo:wght@300;400;500;700;900&display=swap');

  :root {
    --green:    #00B67A;
    --green-dk: #008f5e;
    --green-lt: #e6f9f2;
    --blue:     #0061FF;
    --amber:    #F5A623;
    --red:      #E53535;
    --gray-900: #111827;
    --gray-700: #374151;
    --gray-500: #6B7280;
    --gray-200: #E5E7EB;
    --gray-100: #F3F4F6;
    --bg:       #F8FAF9;
    --card:     #ffffff;
    --radius:   10px;
    --shadow:   0 1px 4px rgba(0,0,0,.08), 0 4px 16px rgba(0,0,0,.06);
  }

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Heebo', sans-serif;
    background: var(--bg);
    color: var(--gray-900);
    min-height: 100vh;
  }

  /* ── Header ── */
  header {
    background: var(--gray-900);
    padding: 18px 28px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    flex-wrap: wrap;
  }
  .logo {
    display: flex;
    align-items: center;
    gap: 12px;
  }
  .logo-icon {
    width: 40px; height: 40px;
    background: var(--green);
    border-radius: 10px;
    display: flex; align-items: center; justify-content: center;
    font-size: 20px;
  }
  .logo h1 {
    color: #fff;
    font-size: 20px;
    font-weight: 700;
    letter-spacing: -.5px;
  }
  .logo span {
    color: var(--green);
  }
  .header-meta {
    font-size: 13px;
    color: #9CA3AF;
    text-align: left;
  }

  /* ── Status bar ── */
  #statusBar {
    padding: 10px 28px;
    font-size: 13px;
    font-weight: 500;
    display: flex;
    align-items: center;
    gap: 8px;
    transition: background .3s;
  }
  .status-live    { background: #D1FAE5; color: #065F46; }
  .status-backup  { background: #FEF3C7; color: #92400E; }
  .status-loading { background: var(--gray-100); color: var(--gray-500); }
  #statusBar .dot {
    width: 8px; height: 8px; border-radius: 50%; background: currentColor;
    flex-shrink: 0;
  }

  /* ── Controls ── */
  .controls {
    padding: 16px 28px;
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    align-items: center;
    background: var(--card);
    border-bottom: 1px solid var(--gray-200);
  }
  .search-wrap {
    position: relative;
    flex: 1;
    min-width: 200px;
    max-width: 340px;
  }
  .search-wrap .icon {
    position: absolute;
    right: 12px;
    top: 50%;
    transform: translateY(-50%);
    color: var(--gray-500);
    pointer-events: none;
  }
  input[type=text] {
    width: 100%;
    padding: 9px 38px 9px 12px;
    border: 1.5px solid var(--gray-200);
    border-radius: var(--radius);
    font-family: inherit;
    font-size: 14px;
    outline: none;
    transition: border-color .2s;
    background: var(--gray-100);
  }
  input[type=text]:focus { border-color: var(--green); background: #fff; }

  select {
    padding: 9px 12px;
    border: 1.5px solid var(--gray-200);
    border-radius: var(--radius);
    font-family: inherit;
    font-size: 14px;
    background: var(--gray-100);
    cursor: pointer;
    outline: none;
  }
  select:focus { border-color: var(--green); }

  .btn {
    padding: 9px 18px;
    border-radius: var(--radius);
    font-family: inherit;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    border: none;
    transition: all .2s;
    display: inline-flex;
    align-items: center;
    gap: 6px;
  }
  .btn-green  { background: var(--green); color: #fff; }
  .btn-green:hover  { background: var(--green-dk); }
  .btn-green:disabled { background: var(--gray-200); color: var(--gray-500); cursor: not-allowed; }

  .counter-wrap {
    margin-right: auto;
    font-size: 13px;
    color: var(--gray-500);
    font-weight: 500;
    white-space: nowrap;
  }
  .counter-wrap strong { color: var(--gray-900); font-size: 20px; font-weight: 700; }

  /* ── Stats row ── */
  .stats-row {
    display: flex;
    gap: 12px;
    padding: 16px 28px;
    flex-wrap: wrap;
  }
  .stat-card {
    background: var(--card);
    border-radius: var(--radius);
    padding: 14px 20px;
    flex: 1;
    min-width: 120px;
    box-shadow: var(--shadow);
    display: flex;
    flex-direction: column;
    gap: 4px;
  }
  .stat-label { font-size: 12px; color: var(--gray-500); font-weight: 500; }
  .stat-value { font-size: 26px; font-weight: 700; line-height: 1; }
  .stat-value.green  { color: var(--green); }
  .stat-value.amber  { color: var(--amber); }
  .stat-value.red    { color: var(--red);   }
  .stat-value.blue   { color: var(--blue);  }

  /* ── Table area ── */
  .table-wrap {
    padding: 0 28px 28px;
    overflow-x: auto;
  }
  table {
    width: 100%;
    border-collapse: collapse;
    background: var(--card);
    border-radius: var(--radius);
    overflow: hidden;
    box-shadow: var(--shadow);
    font-size: 14px;
  }
  th {
    background: var(--gray-900);
    color: #fff;
    padding: 13px 16px;
    text-align: right;
    font-weight: 600;
    white-space: nowrap;
    font-size: 13px;
  }
  td {
    padding: 13px 16px;
    border-bottom: 1px solid var(--gray-100);
    vertical-align: middle;
  }
  tr:last-child td { border-bottom: none; }
  tr:hover td { background: #F0FDF8; }

  /* Badges */
  .badge {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    padding: 4px 10px;
    border-radius: 20px;
    font-size: 12px;
    font-weight: 600;
    white-space: nowrap;
  }
  .badge-pitkit    { background: #DCFCE7; color: #166534; }
  .badge-kashcase  { background: #DBEAFE; color: #1D4ED8; }
  .badge-pitkit2   { background: #EDE9FE; color: #5B21B6; }

  .status-badge {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    padding: 4px 10px;
    border-radius: 20px;
    font-size: 12px;
    font-weight: 600;
  }
  .status-empty   { background: #DCFCE7; color: #166534; }
  .status-full    { background: #FEF3C7; color: #92400E; }
  .status-broken  { background: #FEE2E2; color: #991B1B; }
  .status-unknown { background: var(--gray-100); color: var(--gray-500); }

  .waze-btn {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 7px 14px;
    background: #33CCFF;
    color: #1a2a3a;
    border-radius: 8px;
    text-decoration: none;
    font-weight: 700;
    font-size: 13px;
    transition: background .2s, transform .1s;
    white-space: nowrap;
  }
  .waze-btn:hover { background: #00bfff; color: #000; transform: scale(1.03); }

  .loc-name { font-weight: 700; color: var(--gray-900); }
  .loc-addr { font-size: 12px; color: var(--gray-500); margin-top: 2px; }

  /* Empty state */
  .empty-state {
    text-align: center;
    padding: 60px 20px;
    color: var(--gray-500);
  }
  .empty-state .icon { font-size: 48px; margin-bottom: 12px; }
  .empty-state p { font-size: 15px; }

  /* AI panel */
  .ai-panel {
    margin: 0 28px 20px;
    background: linear-gradient(135deg, #e6f9f2, #f0f8ff);
    border: 1.5px solid #a7f3d0;
    border-radius: var(--radius);
    padding: 16px 20px;
    display: none;
    gap: 12px;
    align-items: flex-start;
  }
  .ai-panel.visible { display: flex; }
  .ai-panel .ai-icon { font-size: 24px; flex-shrink: 0; }
  .ai-panel .ai-text { font-size: 14px; line-height: 1.6; color: var(--gray-700); }
  .ai-panel .ai-text strong { color: var(--gray-900); }

  @keyframes spin { to { transform: rotate(360deg); } }
  .spin { display: inline-block; animation: spin .8s linear infinite; }

  @media (max-width: 640px) {
    header, .controls, .stats-row, .table-wrap { padding-right: 14px; padding-left: 14px; }
    .stats-row { gap: 8px; }
    .stat-card { min-width: 100px; padding: 10px 14px; }
    .stat-value { font-size: 20px; }
  }
</style>
</head>

let allMachines = [];
let displayMachines = [];

// ── Fetch ──
async function loadData() {
  const btn = document.getElementById('refreshBtn');
  const icon = document.getElementById('refreshIcon');

  btn.disabled = true;
  icon.textContent = '⏳';
  icon.className = 'spin';
  setStatus('loading', '⏳ מנסה למשוך נתוני לייב משרת CYCLE...');

  const s3Url = 'https://cycle-app-bucket.s3.amazonaws.com/cycledata.js';
  const bust = '?nc=' + Date.now();

  try {
    const r = await fetchTimeout(s3Url + bust, 2000);
    if (r.ok) {
      const text = await r.text();
      const data = extractJSON(text);
      if (data) {
        finalize(data, 'שרת Cycle הארצי');
        cleanupBtn();
        return;
      }
    }
  } catch(e) { console.warn('Direct S3 blocked or timed out:', e.message); }

  try {
    const r = await fetchTimeout(`https://api.allorigins.win/get?url=${encodeURIComponent(s3Url + bust)}`, 2500);
    if (r.ok) {
      const j = await r.json();
      if (j && j.contents) {
        const data = extractJSON(j.contents);
        if (data) {
          finalize(data, 'Proxy Server');
          cleanupBtn();
          return;
        }
      }
    }
  } catch(e) { console.warn('Proxy method failed:', e.message); }

  useBackup();
  cleanupBtn();
}

function cleanupBtn() {
  const btn = document.getElementById('refreshBtn');
  const icon = document.getElementById('refreshIcon');
  btn.disabled = false;
  icon.textContent = '🔄';
  icon.className = '';
}

function fetchTimeout(url, ms) {
  const ctrl = new AbortController();
  const t = setTimeout(() => ctrl.abort(), ms);
  return fetch(url, { signal: ctrl.signal }).finally(() => clearTimeout(t));
}

function extractJSON(text) {
  try {
    const s = text.indexOf('['), e = text.lastIndexOf(']');
    if (s === -1 || e === -1) return null;
    const arr = JSON.parse(text.substring(s, e + 1));
    return Array.isArray(arr) && arr.length > 0 ? arr : null;
  } catch { return null; }
}

function finalize(data, source) {
  allMachines = normalizeData(data);
  const now = new Date().toLocaleTimeString('he-IL', {hour:'2-digit', minute:'2-digit'});
  setStatus('live', `🟢 מחובר לענן – ${allMachines.length} מכונות ארציות סונכרנו בהצלחה (${now})`);
  document.getElementById('lastUpdate').textContent = `עדכון: ${now} | מקור: ${source}`;
  render();
  generateLocalSummary();
}

function useBackup() {
  allMachines = BACKUP_DATA;
  const now = new Date().toLocaleTimeString('he-IL', {hour:'2-digit', minute:'2-digit'});
  setStatus('backup', `🟡 מאגר ארצי מקומי – מציג פריסה מלאה של ${allMachines.length} מכונות בכל הארץ`);
  document.getElementById('lastUpdate').textContent = `מאגר מקומי מלא | ${now}`;
  render();
  generateLocalSummary();
}

function normalizeData(raw) {
  return raw.map(m => {
    const addr = m.address || m.Address || '';
    const rawType = (m.type || m.Type || '').toUpperCase();
    let type = 'פיתקית';
    if (rawType.includes('KASHCASE') || rawType.includes('KASH')) type = 'KASHCASE';
    else if (rawType.includes('PITKIT2') || rawType.includes('2')) type = 'פיתקית 2';

    const rawStatus = (m.status || m.Status || m.state || '').toLowerCase();
    let status = 'לא ידוע';
    if (rawStatus.includes('empty') || rawStatus.includes('ריק')) status = 'ריקה';
    else if (rawStatus.includes('full') || rawStatus.includes('מלא')) status = 'מלאה';
    else if (rawStatus.includes('broken') || rawStatus.includes('error') || rawStatus.includes('לא תקין')) status = 'לא תקינה';

    return {
      name: m.name || m.location || addr.split(',')[0] || 'לא ידוע',
      address: addr,
      lat: parseFloat(m.lat || m.Lat || 0),
      lng: parseFloat(m.lng || m.Lon || m.lng || 0),
      type, status,
      network: m.network || m.chain || ''
    };
  });
}

// ── Render ──
function render() {
  filterTable();
  renderStats();
}

function filterTable() {
  const q = document.getElementById('searchInput').value.trim().toLowerCase();
  const typeF = document.getElementById('typeFilter').value;
  const statusF = document.getElementById('statusFilter').value;

  displayMachines = allMachines.filter(m => {
    const searchText = `${m.name} ${m.address} ${m.network}`.toLowerCase();
    const matchSearch = !q || searchText.includes(q);
    const matchType = typeF === 'all' || m.type === typeF;
    const matchStatus = statusF === 'all' || m.status === statusF;
    return matchSearch && matchType && matchStatus;
  });

  renderTable();
}

function renderTable() {
  const tbody = document.getElementById('tableBody');
  const empty = document.getElementById('emptyState');

  if (displayMachines.length === 0) {
    tbody.innerHTML = '';
    empty.style.display = 'block';
    document.getElementById('visibleCount').textContent = '0';
    return;
  }

  empty.style.display = 'none';
  document.getElementById('visibleCount').textContent = displayMachines.length;

  tbody.innerHTML = displayMachines.map((m, i) => {
    const typeBadge = m.type === 'KASHCASE'
      ? '<span class="badge badge-kashcase">🔵 KASHCASE</span>'
      : m.type === 'פיתקית 2'
      ? '<span class="badge badge-pitkit2">🟣 פיתקית 2</span>'
      : '<span class="badge badge-pitkit">🟢 פיתקית</span>';

    const statusIcon = m.status === 'ריקה' ? '✅' : m.status === 'מלאה' ? '⚠️' : m.status === 'לא תקינה' ? '❌' : '❓';
    const statusClass = m.status === 'ריקה' ? 'status-empty' : m.status === 'מלאה' ? 'status-full' : m.status === 'לא תקינה' ? 'status-broken' : 'status-unknown';

    const wazeUrl = `https://waze.com/ul?ll=${m.lat},${m.lng}&navigate=yes`;

    return `<tr>
      <td style="color:var(--gray-500);font-size:12px;font-weight:600">${i+1}</td>
      <td>
        <div class="loc-name">${m.name}</div>
        ${m.network ? `<div class="loc-addr">${m.network}</div>` : ''}
      </td>
      <td style="max-width:240px;font-size:13px">${m.address}</td>
      <td>${typeBadge}</td>
      <td><span class="status-badge ${statusClass}">${statusIcon} ${m.status}</span></td>
      <td><a href="${wazeUrl}" target="_blank" class="waze-btn">🚗 Waze</a></td>
    </tr>`;
  }).join('');
}

function renderStats() {
  const total = allMachines.length;
  const empty = allMachines.filter(m => m.status === 'ריקה').length;
  const full  = allMachines.filter(m => m.status === 'מלאה').length;
  const broken= allMachines.filter(m => m.status === 'לא תקינה').length;

  document.getElementById('statsRow').innerHTML = `
    <div class="stat-card"><div class="stat-label">סה"כ מכונות בארץ</div><div class="stat-value blue">${total}</div></div>
    <div class="stat-card"><div class="stat-label">✅ פנויות וריקות</div><div class="stat-value green">${empty}</div></div>
    <div class="stat-card"><div class="stat-label">⚠️ מלאות (איסוף נדרש)</div><div class="stat-value amber">${full}</div></div>
    <div class="stat-card"><div class="stat-label">❌ מושבתות / תקלה</div><div class="stat-value red">${broken}</div></div>
  `;
}

function generateLocalSummary() {
  const panel = document.getElementById('aiPanel');
  const text  = document.getElementById('aiText');
  panel.classList.add('visible');

  const total = allMachines.length;
  const brokenCount = allMachines.filter(m => m.status === 'לא תקינה').length;
  const fullCount = allMachines.filter(m => m.status === 'מלאה').length;

  let summaryHTML = `<strong>📋 תמונת מצב פריסה ארצית:</strong> המערכת מציגה כעת <strong>${total} מכונות מיחזור</strong> בפריסה ארצית מלאה מהצפון ועד אילת. `;
  
  if (brokenCount > 0 || fullCount > 0) {
    summaryHTML += `מתוכן, <strong>${fullCount} מכונות במצב מלא</strong> הממתינות לפינוי ואיסוף, ו-<strong>${brokenCount} מכונות מושבתות</strong> עם חיווי תקלה טכנית. `;
  } else {
    summaryHTML += `כל המכונות ברחבי הארץ מדווחות על סטטוס תקין וזמינות מלאה לציבור. `;
  }

  summaryHTML += `<br>💡 <strong>טיפ סינון:</strong> ניתן להשתמש בתיבת החיפוש כדי לסנן מיידית לפי אזור גיאוגרפי (לדוגמה: "שדות נגב", "באר שבע", "חיפה" או "תל אביב").`;

  text.innerHTML = summaryHTML;
}

function setStatus(type, msg) {
  const bar = document.getElementById('statusBar');
  const txt = document.getElementById('statusText');
  bar.className = `status-${type}`;
  txt.textContent = msg;
}

document.addEventListener('DOMContentLoaded', loadData);
</script>
