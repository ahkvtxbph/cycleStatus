    let currentMachinesList = [];

    async function fetchLiveData() {
        const statusDiv = document.getElementById('connectionStatus');
        const targetUrl = 'https://cycle-app-bucket.s3.amazonaws.com/cycledata.js';
        const proxyUrl = `https://api.allorigins.win/get?url=${encodeURIComponent(targetUrl)}`;

        const controller = new AbortController();
        const timeoutId = setTimeout(() => controller.abort(), 2500);

        try {
            const response = await fetch(proxyUrl, { signal: controller.signal });
            clearTimeout(timeoutId);
            
            if (!response.ok) throw new Error('Network error');
            
            const wrapper = await response.json();
            let rawText = wrapper.contents;
            rawText = rawText.replace('const cycleData =', '').trim();
            if(rawText.endsWith(';')) rawText = rawText.slice(0, -1);
            
            const liveData = JSON.parse(rawText);
            
            if (liveData && liveData.length > 0) {
                currentMachinesList = liveData;
                statusDiv.innerText = "🟢 מחובר בזמן אמת: נתוני הקיבולת והסטטוס מעודכנים משרתי Cycle הארציים";
                statusDiv.className = "status-bar status-live";
                renderTable();
                return;
            }
        } catch (error) {
            console.log("Live fetch timed out or blocked, loading full backup data instead.");
        }

        // טעינת הגיבוי הארצי המלא (קורה בשבריר שנייה)
        currentMachinesList = backupData;
        statusDiv.innerText = "🟡 מצב מקומי: מציג את כל המיקומים בארץ (נתוני פנוי/מלא בזמן אמת חסומים ברשת זו)";
        statusDiv.className = "status-bar status-backup";
        renderTable();
    }

    function renderTable() {
        const tbody = document.getElementById('tableBody');
        let htmlRows = '';

        currentMachinesList.forEach((machine, index) => {
            const addressText = machine.address || '';
            const rawType = machine.type || '';
            
            let isKashcase = rawType.toUpperCase().includes('KASHCASE') || 
                             addressText.toUpperCase().includes('KASHCASE') || 
                             addressText.includes('כפר מימון') || 
                             addressText.includes('סעד');
            const currentTypeStr = isKashcase ? 'KASHCASE' : 'פיתקית';
            const typeBadge = isKashcase ? '<span class="type-kashcash">KASHCASE</span>' : '<span class="type-pitkit">פיתקית</span>';

            const isFull = (machine.status === 1 || machine.status === "1");
            const statusStr = isFull ? 'full' : 'available';
            const statusBadge = isFull 
                ? '<div class="status-indicator"><span class="dot dot-full"></span><span class="text-full">מלאה</span></div>' 
                : '<div class="status-indicator"><span class="dot dot-available"></span><span class="text-available">פנויה</span></div>';

            const lat = machine.lat || 0;
            const lng = machine.lng || 0;
            const wazeUrl = `https://waze.com/ul?ll=${lat},${lng}&navigate=yes`;

            htmlRows += `
                <tr data-machine-type="${currentTypeStr}" data-machine-status="${statusStr}">
                    <td><span class="badge badge-index">${index + 1}</span></td>
                    <td>${typeBadge}</td>
                    <td>${statusBadge}</td>
                    <td><b>${addressText}</b></td>
                    <td><code>${lat}</code></td>
                    <td><code>${lng}</code></td>
                    <td>
                        <a href="${wazeUrl}" target="_blank" class="waze-btn">🚗 ניווט</a>
                    </td>
                </tr>
            `;
        });

        tbody.innerHTML = htmlRows;
        document.getElementById('machineCounter').innerText = `נמצאו: ${currentMachinesList.length} מכונות במערכת`;
        filterTable();
    }

    function filterTable() {
        const filterText = document.getElementById('searchInput').value.toLowerCase().trim();
        const filterType = document.getElementById('typeFilter').value;
        const filterStatus = document.getElementById('statusFilter').value;
        const rows = document.getElementById('tableBody').getElementsByTagName('tr');
        let visibleCount = 0;

        for (let i = 0; i < rows.length; i++) {
            const row = rows[i];
            const textContent = row.textContent || row.innerText;
            const machineType = row.getAttribute('data-machine-type');
            const machineStatus = row.getAttribute('data-machine-status');
            
            const matchesSearch = textContent.toLowerCase().indexOf(filterText) > -1;
            const matchesType = (filterType === 'all' || machineType === filterType);
            const matchesStatus = (filterStatus === 'all' || machineStatus === filterStatus);

            if (matchesSearch && matchesType && matchesStatus) {
                row.style.display = "";
                visibleCount++;
            } else {
                row.style.display = "none";
            }
        }
        document.getElementById('machineCounter').innerText = `נמצאו: ${visibleCount} מכונות תואמות לסינון`;
    }

    document.addEventListener('DOMContentLoaded', fetchLiveData);
