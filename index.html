<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>מערכת מיקומי מכונות מיחזור</title>
    <script src="data.js"></script>
    <style>
        body { font-family: sans-serif; background: #f4f7f6; padding: 20px; }
        .container { max-width: 1000px; margin: auto; background: white; padding: 20px; border-radius: 8px; }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        th, td { padding: 12px; border-bottom: 1px solid #ddd; text-align: right; }
        .status-badge { font-weight: bold; }
        .dot { height: 10px; width: 10px; border-radius: 50%; display: inline-block; margin-left: 5px; }
        .bg-green { background-color: #28a745; }
        .bg-red { background-color: #dc3545; }
    </style>
</head>
<body>

<div class="container">
    <h1>רשימת מכונות מיחזור</h1>
    <div id="connectionStatus" style="font-weight:bold; margin-bottom: 20px;">טוען נתונים...</div>
    
    <table id="machinesTable">
        <thead>
            <tr>
                <th>מספר</th>
                <th>סוג</th>
                <th>סטטוס</th>
                <th>כתובת</th>
                <th>ניווט</th>
            </tr>
        </thead>
        <tbody id="tableBody"></tbody>
    </table>
</div>

<script>
    function renderTable() {
        const tbody = document.getElementById('tableBody');
        const statusDiv = document.getElementById('connectionStatus');
        
        // בדיקה אם הנתונים נטענו מהקובץ
        if (typeof cycleData === 'undefined') {
            statusDiv.innerHTML = "⚠️ שגיאה: קובץ הנתונים (data.js) לא נמצא או ריק.";
            return;
        }

        const updateTime = typeof lastUpdate !== 'undefined' ? lastUpdate : "לא ידוע";
        statusDiv.innerHTML = `🟢 נתונים מעודכנים. עדכון אחרון: ${updateTime}`;

        let html = '';
        cycleData.forEach((m, i) => {
            const isFull = (m.status == 1);
            const statusClass = isFull ? 'bg-red' : 'bg-green';
            const statusText = isFull ? 'מלאה' : 'פנויה';
            
            html += `<tr>
                <td>${i+1}</td>
                <td>${m.type || 'N/A'}</td>
                <td><span class="dot ${statusClass}"></span>${statusText}</td>
                <td>${m.address}</td>
                <td><a href="https://waze.com/ul?ll=${m.lat},${m.lng}&navigate=yes" target="_blank">ניווט</a></td>
            </tr>`;
        });
        tbody.innerHTML = html;
    }

    // הפעלה כשהדף נטען
    window.onload = renderTable;
</script>

</body>
</html>
